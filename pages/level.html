<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Boxy Action - Levels</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-bg {
      background-color: #111827;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .level-card {
      transition:
        transform 100ms ease,
        box-shadow 100ms ease;
    }

    .level-card:not(.locked):hover {
      transform: translate(-3px, -3px);
    }

    .level-card:not(.locked):active {
      transform: translate(4px, 4px);
      box-shadow: 0 0 0 #000 !important;
    }

    .locked {
      cursor: not-allowed;
    }
  </style>
</head>

<body class="game-bg min-h-screen text-white">

  <main class="min-h-screen px-5 py-10">

    <section class="mx-auto w-full max-w-2xl">

      <!-- Header -->
      <header class="mb-8 flex items-center justify-between">

        <div>
          <p class="text-xs font-black uppercase tracking-[0.3em] text-lime-400">
            BOXY
          </p>

          <h1 class="mt-1 text-4xl font-black uppercase">
            Select Level
          </h1>
        </div>

        <div
          class="flex h-12 w-12
                 items-center justify-center
                 rotate-3
                 bg-cyan-400
                 text-2xl
                 shadow-[6px_6px_0_#000]"
        >
          ★
        </div>

      </header>


      <!-- Progress -->
      <div
        class="mb-8
               bg-white
               px-5 py-4
               text-slate-950
               shadow-[7px_7px_0_#000]"
      >

        <div class="flex items-center justify-between">

          <div>
            <p class="text-xs font-black uppercase tracking-widest text-slate-500">
              Progress
            </p>

            <p class="mt-1 text-2xl font-black">
              3 / 8 Levels
            </p>
          </div>

          <div class="text-right">
            <p class="text-xs font-black uppercase tracking-widest text-slate-500">
              Best Score
            </p>

            <p class="mt-1 text-2xl font-black text-orange-500">
              12,450
            </p>
          </div>

        </div>

        <!-- Progress bar -->
        <div class="mt-4 h-4 bg-slate-200 shadow-[3px_3px_0_#000]">
          <div
            class="h-full w-[37.5%] bg-lime-400"
          ></div>
        </div>

      </div>


      <!-- Levels -->
      <div class="grid grid-cols-2 gap-5 sm:grid-cols-4">

        <!-- LEVEL 1 -->
        <button
          class="level-card
                 bg-cyan-400
                 p-5
                 text-left
                 text-slate-950
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-lg">✓</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            01
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            First Steps
          </p>

          <div class="mt-4 text-xs font-bold text-slate-800">
            ★ ★ ★
          </div>
        </button>


        <!-- LEVEL 2 -->
        <button
          class="level-card
                 bg-lime-400
                 p-5
                 text-left
                 text-slate-950
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-lg">✓</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            02
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            Speed Run
          </p>

          <div class="mt-4 text-xs font-bold text-slate-800">
            ★ ★ ☆
          </div>
        </button>


        <!-- LEVEL 3 -->
        <button
          class="level-card
                 bg-orange-400
                 p-5
                 text-left
                 text-slate-950
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-lg">✓</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            03
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            Chaos
          </p>

          <div class="mt-4 text-xs font-bold text-slate-800">
            ★ ★ ★
          </div>
        </button>


        <!-- LEVEL 4 - UNLOCKED -->
        <button
          class="level-card
                 bg-pink-500
                 p-5
                 text-left
                 text-white
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-lg">▶</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            04
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            Danger Zone
          </p>

          <div class="mt-4 text-xs font-bold text-pink-100">
            NOT COMPLETED
          </div>
        </button>


        <!-- LEVEL 5 - LOCKED -->
        <button
          disabled
          class="level-card locked
                 bg-slate-300
                 p-5
                 text-left
                 text-slate-500
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-xl">🔒</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            05
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            Locked
          </p>

          <div class="mt-4 text-[10px] font-black uppercase">
            Complete Level 04
          </div>
        </button>


        <!-- LEVEL 6 - LOCKED -->
        <button
          disabled
          class="level-card locked
                 bg-slate-300
                 p-5
                 text-left
                 text-slate-500
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-xl">🔒</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            06
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            Locked
          </p>

          <div class="mt-4 text-[10px] font-black uppercase">
            Complete Level 05
          </div>
        </button>


        <!-- LEVEL 7 - LOCKED -->
        <button
          disabled
          class="level-card locked
                 bg-slate-300
                 p-5
                 text-left
                 text-slate-500
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-xl">🔒</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            07
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            Locked
          </p>

          <div class="mt-4 text-[10px] font-black uppercase">
            Complete Level 06
          </div>
        </button>


        <!-- LEVEL 8 - LOCKED -->
        <button
          disabled
          class="level-card locked
                 bg-slate-300
                 p-5
                 text-left
                 text-slate-500
                 shadow-[7px_7px_0_#000]"
        >
          <div class="flex items-start justify-between">
            <span class="text-xs font-black uppercase tracking-widest">
              Level
            </span>

            <span class="text-xl">🔒</span>
          </div>

          <p class="mt-3 text-4xl font-black">
            08
          </p>

          <p class="mt-2 text-xs font-black uppercase">
            Locked
          </p>

          <div class="mt-4 text-[10px] font-black uppercase">
            Complete Level 07
          </div>
        </button>

      </div>


      <!-- Difficulty -->
      <div
        class="mt-8
               bg-slate-950
               p-5
               shadow-[7px_7px_0_#000]"
      >

        <div class="flex items-center justify-between">

          <div>
            <p class="text-xs font-black uppercase tracking-widest text-slate-400">
              Difficulty
            </p>

            <p class="mt-1 text-xl font-black uppercase">
              Normal
            </p>
          </div>

          <div class="flex gap-2">

            <button
              class="bg-lime-400
                     px-4 py-3
                     text-xs font-black uppercase
                     text-slate-950
                     shadow-[4px_4px_0_#000]"
            >
              Normal
            </button>

            <button
              class="bg-slate-700
                     px-4 py-3
                     text-xs font-black uppercase
                     text-slate-400"
            >
              Hard
            </button>

          </div>

        </div>

      </div>


      <!-- Back -->
      <button
        class="mt-7 w-full
               bg-white
               px-6 py-5
               text-lg font-black uppercase
               text-slate-950
               shadow-[8px_8px_0_#000]
               transition
               hover:-translate-x-1
               hover:-translate-y-1"
      >
        ← &nbsp; Back
      </button>

    </section>

  </main>

</body>
</html>
